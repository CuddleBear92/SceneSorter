name: Release

# Versions are flat build numbers: v1, v2, v3, ...
# Run it from Actions ▸ Release ▸ Run workflow. Leave "version" empty to use the
# next number automatically, or push a tag like v7. The workflow creates a
# GitHub Release with SceneSorter.exe attached; the in-app updater picks it up.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Build number (leave empty for next)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            # highest flat vN tag so far (the old v0.1.0 counts as build 1) + 1
            LAST=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
                   | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
            V=$(( ${LAST:-1} + 1 ))
          fi
          V="${V#v}"
          case "$V" in (*[!0-9]*|"") echo "Version must be a whole number, got '$V'"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "__version__ = \"$V\"" > scenesorter/_version.py

      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller --noconfirm --onefile --windowed --name SceneSorter run.py

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" dist/SceneSorter.exe \
            --target "${{ github.sha }}" \
            --title "SceneSorter build ${{ steps.ver.outputs.version }}" \
            --generate-notes
