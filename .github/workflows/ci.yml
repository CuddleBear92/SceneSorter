name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (image tests use QtGui offscreen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    # Builds a test exe on every push so you can grab it from the run's artifacts.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Stamp dev version
        shell: bash
        run: echo "__version__ = \"0-dev+${GITHUB_SHA::7}\"" > scenesorter/_version.py
      - run: pyinstaller --noconfirm --onefile --windowed --name SceneSorter run.py
      - uses: actions/upload-artifact@v6
        with:
          name: SceneSorter-${{ github.sha }}
          path: dist/SceneSorter.exe
